<svg xmlns="http://www.w3.org/2000/svg" width="160" height="140" viewBox="0 0 160 140">
  <!-- ground -->
  <line x1="20" y1="130" x2="140" y2="130" stroke="#BE9A5F" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- floating notes -->
  <g font-family="'Courier New', monospace" font-size="18" fill="#BE9A5F">
    <text x="122" y="70" opacity="0">♪
      <animate attributeName="y" values="70;15" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="12" y="80" opacity="0">♫
      <animate attributeName="y" values="80;25" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- the duck (static position and size) -->
  <g transform="translate(36 14) scale(1.6)">
    <!-- sway side to side, pivoting at the feet -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 27 70; 6 27 70; -6 27 70" dur="0.8s" repeatCount="indefinite"/>

      <!-- head and body bounce -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.4s" repeatCount="indefinite"/>
        <rect x="15" y="0" width="20" height="5" fill="#E6D9BE"/>
        <rect x="10" y="5" width="30" height="5" fill="#E6D9BE"/>
        <rect x="5" y="10" width="10" height="5" fill="#E8943A"/>
        <rect x="15" y="10" width="5" height="5" fill="#E6D9BE"/>
        <rect x="20" y="10" width="5" height="5" fill="#1c1a19"/>
        <rect x="25" y="10" width="15" height="5" fill="#E6D9BE"/>
        <rect x="0" y="15" width="15" height="5" fill="#E8943A"/>
        <rect x="15" y="15" width="25" height="5" fill="#E6D9BE"/>
        <rect x="15" y="20" width="20" height="5" fill="#E6D9BE"/>
        <rect x="10" y="25" width="35" height="5" fill="#E6D9BE"/>
        <rect x="10" y="30" width="45" height="5" fill="#E6D9BE"/>
        <rect x="10" y="35" width="45" height="5" fill="#E6D9BE"/>
        <rect x="10" y="40" width="45" height="5" fill="#E6D9BE"/>
        <rect x="15" y="45" width="35" height="5" fill="#E6D9BE"/>
        <rect x="20" y="50" width="25" height="5" fill="#E6D9BE"/>
      </g>

      <!-- left leg lifts -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 0; 0 0" dur="0.8s" repeatCount="indefinite"/>
        <rect x="25" y="55" width="5" height="10" fill="#E8943A"/>
        <rect x="20" y="65" width="10" height="5" fill="#E8943A"/>
      </g>

      <!-- right leg lifts (half a beat later) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 0; 0 -4; 0 0" dur="0.8s" repeatCount="indefinite"/>
        <rect x="40" y="55" width="5" height="10" fill="#E8943A"/>
        <rect x="40" y="65" width="10" height="5" fill="#E8943A"/>
      </g>
    </g>
  </g>
</svg>
