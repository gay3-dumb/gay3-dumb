<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <!-- background -->
  <rect width="800" height="200" fill="#1c1a19"/>

  <!-- burgundy strips at top and bottom -->
  <rect x="0" y="0" width="800" height="14" fill="#7A1F2B"/>
  <rect x="0" y="186" width="800" height="14" fill="#7A1F2B"/>

  <!-- dashed amber frame, like a label on a record sleeve -->
  <rect x="12" y="26" width="776" height="148" fill="none" stroke="#D6A756" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- terminal prompt line -->
  <text x="48" y="62" font-family="'Courier New', monospace" font-size="16" fill="#D6A756">~/record-shop $ whoami</text>

  <!-- big name -->
  <text x="48" y="124" font-family="'Courier New', monospace" font-size="64" font-weight="bold" fill="#F3E6C8">gay3</text>

  <!-- tagline -->
  <text x="48" y="156" font-family="'Courier New', monospace" font-size="18" fill="#D6A756">cs student // bugs and playlists</text>

  <!-- spinning vinyl record -->
  <g>
    <circle cx="630" cy="100" r="60" fill="#0e0d0c"/>
    <circle cx="630" cy="100" r="52" fill="none" stroke="#2a2725" stroke-width="2"/>
    <circle cx="630" cy="100" r="44" fill="none" stroke="#2a2725" stroke-width="2"/>
    <circle cx="630" cy="100" r="36" fill="none" stroke="#2a2725" stroke-width="2"/>
    <!-- shine, so you can see it spin -->
    <path d="M 630 44 A 56 56 0 0 1 686 100" fill="none" stroke="#4a4440" stroke-width="3"/>
    <!-- centre label -->
    <circle cx="630" cy="100" r="22" fill="#7A1F2B"/>
    <circle cx="630" cy="100" r="22" fill="none" stroke="#D6A756" stroke-width="1.5"/>
    <circle cx="630" cy="88" r="3" fill="#F3E6C8"/>
    <circle cx="630" cy="100" r="3" fill="#1c1a19"/>
    <animateTransform attributeName="transform" type="rotate" from="0 630 100" to="360 630 100" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- pixel duck (each square is 5x5 pixels) -->
  <g>
    <!-- head and beak -->
    <rect x="15" y="0" width="20" height="5" fill="#F3E6C8"/>
    <rect x="10" y="5" width="30" height="5" fill="#F3E6C8"/>
    <rect x="5" y="10" width="10" height="5" fill="#E8943A"/>
    <rect x="15" y="10" width="5" height="5" fill="#F3E6C8"/>
    <rect x="20" y="10" width="5" height="5" fill="#1c1a19"/>
    <rect x="25" y="10" width="15" height="5" fill="#F3E6C8"/>
    <rect x="0" y="15" width="15" height="5" fill="#E8943A"/>
    <rect x="15" y="15" width="25" height="5" fill="#F3E6C8"/>
    <!-- neck and body -->
    <rect x="15" y="20" width="20" height="5" fill="#F3E6C8"/>
    <rect x="10" y="25" width="35" height="5" fill="#F3E6C8"/>
    <rect x="10" y="30" width="45" height="5" fill="#F3E6C8"/>
    <rect x="10" y="35" width="10" height="5" fill="#F3E6C8"/>
    <rect x="20" y="35" width="15" height="5" fill="#D9C9A3"/>
    <rect x="35" y="35" width="20" height="5" fill="#F3E6C8"/>
    <rect x="10" y="40" width="10" height="5" fill="#F3E6C8"/>
    <rect x="20" y="40" width="20" height="5" fill="#D9C9A3"/>
    <rect x="40" y="40" width="15" height="5" fill="#F3E6C8"/>
    <rect x="15" y="45" width="35" height="5" fill="#F3E6C8"/>
    <rect x="20" y="50" width="25" height="5" fill="#F3E6C8"/>
    <!-- legs and feet -->
    <rect x="25" y="55" width="5" height="10" fill="#E8943A"/>
    <rect x="40" y="55" width="5" height="10" fill="#E8943A"/>
    <rect x="20" y="65" width="10" height="5" fill="#E8943A"/>
    <rect x="40" y="65" width="10" height="5" fill="#E8943A"/>
    <!-- gentle bobbing -->
    <animateTransform attributeName="transform" type="translate" values="712 98; 712 94; 712 98" dur="1.2s" repeatCount="indefinite"/>
  </g>
    <!-- blinking cursor after whoami -->
  <rect x="262" y="49" width="9" height="16" fill="#D6A756">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- tiny equalizer (bars grow upward from y=150) -->
  <g fill="#D6A756">
    <rect x="470" y="140" width="8" height="10">
      <animate attributeName="height" values="10;36;18;30;10" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="140;114;132;120;140" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="484" y="140" width="8" height="10">
      <animate attributeName="height" values="24;8;34;14;24" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="126;142;116;136;126" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="498" y="140" width="8" height="10">
      <animate attributeName="height" values="14;40;12;26;14" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="136;110;138;124;136" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="512" y="140" width="8" height="10">
      <animate attributeName="height" values="32;12;28;8;32" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="118;138;122;142;118" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="526" y="140" width="8" height="10">
      <animate attributeName="height" values="12;30;20;38;12" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="138;120;130;112;138" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
